<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#41BDF5" stroke="#0D94D6" stroke-width="4"/>
  
  <!-- Document/List icon -->
  <g transform="translate(64, 48)">
    <!-- Paper background -->
    <rect x="0" y="0" width="128" height="160" rx="8" fill="#FFFFFF" stroke="#0D94D6" stroke-width="3"/>
    
    <!-- List lines -->
    <line x1="20" y1="30" x2="108" y2="30" stroke="#41BDF5" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="55" x2="108" y2="55" stroke="#41BDF5" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="80" x2="108" y2="80" stroke="#41BDF5" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="105" x2="88" y2="105" stroke="#41BDF5" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="130" x2="98" y2="130" stroke="#41BDF5" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Checkmarks (bullets) -->
    <circle cx="20" cy="30" r="4" fill="#18A558"/>
    <circle cx="20" cy="55" r="4" fill="#18A558"/>
    <circle cx="20" cy="80" r="4" fill="#18A558"/>
    <circle cx="20" cy="105" r="4" fill="#18A558"/>
    <circle cx="20" cy="130" r="4" fill="#18A558"/>
  </g>
</svg>
